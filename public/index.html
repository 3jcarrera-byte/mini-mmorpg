<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini MMORPG - Diablo Style</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <!-- 1. PANTALLA LOGIN -->
    <div id="screen-login" class="screen active">
        <div class="box">
            <h2>ARENA Y GLORIA</h2>
            <h3>INICIAR SESIÓN</h3>
            <input type="text" id="login-username" placeholder="Usuario">
            <input type="password" id="login-password" placeholder="Contraseña">
            <button id="btn-login" class="btn-large">ENTRAR AL REINO</button>
            <button id="btn-to-register" class="btn-secondary">REGISTRARSE</button>
            <button id="btn-to-forgot" class="btn-secondary" style="font-size: 10px; margin-top: 5px;">¿Olvidaste tu contraseña?</button>
        </div>
    </div>

    <!-- 2. PANTALLA REGISTRO -->
    <div id="screen-register" class="screen">
        <div class="box">
            <h2>CREAR CUENTA</h2>
            <input type="text" id="reg-username" placeholder="Usuario">
            <input type="email" id="reg-email" placeholder="Correo Electrónico">
            <input type="password" id="reg-password" placeholder="Contraseña">
            <button id="btn-register-submit" class="btn-large">REGISTRARSE</button>
            <button id="btn-back-to-login" class="btn-secondary">VOLVER AL LOGIN</button>
        </div>
    </div>

    <!-- 3. PANTALLA RECUPERAR CLAVE / SOPORTE -->
    <div id="screen-forgot" class="screen">
        <div class="box">
            <h2>RECUPERAR CLAVE</h2>
            <p style="font-size: 11px; color: #aaa;">Se enviará una solicitud de recuperación a soporte técnico.</p>
            <input type="email" id="forgot-email" placeholder="Tu Correo Registrado">
            <button id="btn-send-support" class="btn-large">ENVIAR CORREO A SOPORTE</button>
            <button id="btn-forgot-to-login" class="btn-secondary">CANCELAR</button>
        </div>
    </div>

    <!-- 4. PANTALLA SELECCIÓN / CREACIÓN (CINEMÁTICA 3D) -->
    <div id="screen-character" class="screen full-cinematic">
        <canvas id="characterCanvas" class="cinematic-canvas"></canvas>

        <div id="panel-top-name" class="panel-top-name">
            <h2 id="char-display-name">SELECCIONA TU HÉROE</h2>
        </div>

        <!-- Panel Izquierdo: Lista de Personajes -->
        <div id="panel-characters" class="panel-left-actions">
            <h3>MIS HÉROES</h3>
            <div id="character-list" style="flex: 1; overflow-y: auto;"></div>
            <button id="btn-to-create" class="btn-large">+ NUEVO HÉROE</button>
            <button id="btn-logout" class="btn-secondary">SALIR</button>
        </div>

        <!-- Flechas de Selección 3D (Solo en modo creación) -->
        <button id="btn-arrow-left" class="btn-arrow arrow-left">&lt;</button>
        <button id="btn-arrow-right" class="btn-arrow arrow-right">&gt;</button>

        <!-- Panel Inferior: Datos para Creación -->
        <div id="panel-create-controls" class="panel-bottom" style="display: none;">
            <input type="text" id="create-char-name" placeholder="Nombre del Personaje" maxlength="16">
            <div style="display: flex; gap: 10px;">
                <button id="btn-confirm-create" class="btn-large">CREAR PERSONAJE</button>
                <button id="btn-cancel-create" class="btn-secondary" style="width: 40%;">CANCELAR</button>
            </div>
        </div>

        <!-- Panel Derecho: Entrar al Juego -->
        <div id="panel-enter-game" class="panel-right">
            <h3>DETALLES</h3>
            <div id="char-stats-info" style="font-size: 12px; color: #ccc; margin-bottom: 15px;">
                Selecciona un personaje de la lista para ver sus atributos.
            </div>
            <button id="btn-play" class="btn-large" style="display: none;">ENTRAR AL MUNDO</button>
        </div>
    </div>

    <!-- 5. PANTALLA JUEGO -->
    <div id="screen-game" class="screen">
        <div class="game-container">
            <canvas id="mapCanvas" width="800" height="600"></canvas>
            <div class="hud">
                <span id="hud-char-name"></span> | HP: <span id="hud-hp">100/100</span> | MUNDO MULTIJUGADOR
            </div>
        </div>
    </div>

    <script src="js/character.js"></script>
    <script src="js/game.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
